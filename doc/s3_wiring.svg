<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">
  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#222">ESP32-S3 DevKitC-1 as modem and controller receiver for the Tang Nano 20K</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#555">Tang Nano 20K seen from above, USB-C at the top, HDMI at the bottom; its right pin header in board order</text>

  <!-- ESP32-S3 DevKitC-1 -->
  <rect x="70" y="200" width="250" height="370" rx="10" fill="#1d3b5a" stroke="#0e2238" stroke-width="3"/>
  <text x="195" y="230" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">ESP32-S3 DevKitC-1</text>
  <text x="195" y="250" text-anchor="middle" fill="#cfe0f0" font-size="12">N16R8, Zimodem with Bluepad32 - pins listed by function, find them on the silkscreen</text>
  <rect x="120" y="400" width="150" height="90" rx="6" fill="#8a97a3" stroke="#5c6770" stroke-width="2"/>
  <rect x="120" y="400" width="150" height="22" fill="#c9d3da"/>
  <text x="195" y="416" text-anchor="middle" fill="#3a444c" font-size="12">antenna</text>
  <text x="195" y="462" text-anchor="middle" fill="#ffffff" font-size="13">ESP32-S3-WROOM-1</text>
  <!-- S3 pins, right edge -->
  <g fill="#e8c84a" stroke="#8c7a1e" stroke-width="1.5">
    <rect x="304" y="290" width="20" height="20"/>
    <rect x="304" y="350" width="20" height="20"/>
    <rect x="304" y="380" width="20" height="20"/>
    <rect x="304" y="530" width="20" height="20"/>
  </g>
  <g fill="#ffffff" font-size="15" text-anchor="end">
    <text x="296" y="305">GPIO16 (TX)</text>
    <text x="296" y="365">GPIO17 (joystick)</text>
    <text x="296" y="395">GPIO15 (RX)</text>
    <text x="296" y="545">GND</text>
  </g>
  <!-- USB sockets at the bottom of the S3 -->
  <rect x="105" y="535" width="70" height="26" rx="6" fill="#c0c8cf" stroke="#5c6770" stroke-width="2"/>
  <text x="140" y="553" text-anchor="middle" font-size="13" fill="#222">USB</text>
  <rect x="200" y="535" width="70" height="26" rx="6" fill="#c0c8cf" stroke="#5c6770" stroke-width="2"/>
  <text x="235" y="553" text-anchor="middle" font-size="13" fill="#222">UART</text>
  <path d="M235 561 L235 610" stroke="#333" stroke-width="5" fill="none"/>
  <rect x="160" y="610" width="150" height="44" rx="6" fill="#eeeeee" stroke="#555" stroke-width="2"/>
  <text x="235" y="629" text-anchor="middle" font-size="13" fill="#222">PC or USB power supply</text>
  <text x="235" y="646" text-anchor="middle" font-size="12" fill="#444">5 V and debug output, 115200</text>

  <!-- Tang Nano 20K, top view -->
  <rect x="640" y="90" width="260" height="620" rx="12" fill="#2f6b3a" stroke="#1d4424" stroke-width="3"/>
  <rect x="740" y="84" width="60" height="22" rx="5" fill="#c0c8cf" stroke="#5c6770" stroke-width="2"/>
  <text x="770" y="100" text-anchor="middle" font-size="11" fill="#222">USB-C</text>
  <rect x="725" y="690" width="90" height="26" rx="5" fill="#c0c8cf" stroke="#5c6770" stroke-width="2"/>
  <text x="770" y="708" text-anchor="middle" font-size="11" fill="#222">HDMI</text>
  <text x="770" y="150" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Tang Nano 20K</text>
  <rect x="735" y="180" width="80" height="80" rx="4" fill="#4a4a4a" stroke="#222" stroke-width="2"/>
  <text x="775" y="225" text-anchor="middle" fill="#ffffff" font-size="12">GW2AR-18</text>
  <text x="775" y="320" text-anchor="middle" fill="#d6ecd9" font-size="12">onboard BL616</text>
  <text x="775" y="338" text-anchor="middle" fill="#d6ecd9" font-size="12">= the companion</text>

  <!-- right header, 20 pins in board order, top to bottom -->
  <g fill="#e8c84a" stroke="#8c7a1e" stroke-width="1.2">
    <rect x="647" y="112" width="16" height="16"/>
    <rect x="647" y="140" width="16" height="16"/>
    <rect x="647" y="168" width="16" height="16"/>
    <rect x="647" y="196" width="16" height="16"/>
    <rect x="647" y="224" width="16" height="16"/>
    <rect x="647" y="252" width="16" height="16"/>
    <rect x="647" y="280" width="16" height="16"/>
    <rect x="647" y="308" width="16" height="16"/>
    <rect x="647" y="336" width="16" height="16"/>
    <rect x="647" y="364" width="16" height="16"/>
    <rect x="647" y="392" width="16" height="16"/>
    <rect x="647" y="420" width="16" height="16"/>
    <rect x="647" y="448" width="16" height="16"/>
    <rect x="647" y="476" width="16" height="16"/>
    <rect x="647" y="504" width="16" height="16"/>
    <rect x="647" y="532" width="16" height="16"/>
    <rect x="647" y="560" width="16" height="16"/>
    <rect x="647" y="588" width="16" height="16"/>
    <rect x="647" y="616" width="16" height="16"/>
    <rect x="647" y="644" width="16" height="16"/>
  </g>
  <g fill="#ffffff" font-size="13">
    <text x="670" y="125">5V</text>
    <text x="670" y="153">GND</text>
    <text x="670" y="181">76</text>
    <text x="670" y="209">80</text>
    <text x="670" y="237">42</text>
    <text x="670" y="265" font-weight="bold" font-size="15">41</text>
    <text x="670" y="293">56  (leave free)</text>
    <text x="670" y="321" font-weight="bold" font-size="15">54</text>
    <text x="670" y="349" font-weight="bold" font-size="15">51</text>
    <text x="670" y="377">48  (companion console out)</text>
    <text x="670" y="405">55</text>
    <text x="670" y="433">49</text>
    <text x="670" y="461">86</text>
    <text x="670" y="489">79</text>
    <text x="670" y="517" font-weight="bold" font-size="15">GND</text>
    <text x="670" y="545">3V3</text>
    <text x="670" y="573">72</text>
    <text x="670" y="601">71</text>
    <text x="670" y="629">53</text>
    <text x="670" y="657">52</text>
  </g>

  <!-- wires: S3 pin (x=324) to Tang header (x=647) -->
  <g stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M324 300 L647 260" stroke="#2e9e4f"/>
    <path d="M324 360 L647 316" stroke="#e08a1e"/>
    <path d="M324 390 L647 344" stroke="#2a6fd6"/>
    <path d="M324 540 L647 512" stroke="#222222"/>
  </g>
  <g font-size="13" fill="#222">
    <text x="345" y="272">GPIO16 to 41: modem TX</text>
    <text x="345" y="336" fill="#8a4d00">GPIO17 to 54: controller bytes</text>
    <text x="345" y="418" fill="#1f4f9c">GPIO15 to 51: modem RX</text>
    <text x="345" y="510">GND to GND</text>
  </g>

  <text x="70" y="735" font-size="14" fill="#333">Power the S3 only through its "UART" socket. No 5 V lead from the Tang: on that jumper the S3 browns out when the radio starts.</text>
</svg>
